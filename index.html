<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff5e9c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Une invitation pour toi... 💕</title>
  <style>
    :root {
      --pink: #ff7eb3;
      --pink-deep: #ff5e9c;
      --bg1: #ffe6f0;
      --bg2: #fff0f6;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow: hidden;
      position: relative;
      padding: 20px;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      overscroll-behavior: none;
    }

    /* Coeurs flottants en arrière-plan */
    .heart-bg {
      position: fixed;
      bottom: -40px;
      font-size: 24px;
      opacity: 0.6;
      animation: float-up linear infinite;
      user-select: none;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes float-up {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 2;
      background: #fff;
      border-radius: 28px;
      padding: 40px 32px 48px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(255, 94, 156, 0.25);
      animation: pop-in 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    @keyframes pop-in {
      0%   { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      color: var(--pink-deep);
      font-size: 28px;
      margin: 18px 0 6px;
    }

    p.subtitle {
      color: #8a6b78;
      font-size: 16px;
      margin: 0 0 28px;
    }

    /* Le chaton */
    .kitten {
      width: 180px;
      height: 180px;
      margin: 0 auto;
      animation: bob 3s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    .buttons {
      position: relative;
      margin-top: 8px;
      min-height: 80px;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
      padding: 14px 30px;
      border-radius: 50px;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  font-size 0.45s ease,
                  padding 0.45s ease,
                  box-shadow 0.3s ease;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    #yesBtn {
      background: linear-gradient(135deg, var(--pink), var(--pink-deep));
      color: #fff;
      box-shadow: 0 8px 20px rgba(255, 94, 156, 0.4);
      transform-origin: center;
      position: relative;
      z-index: 10;
    }

    #yesBtn:hover {
      box-shadow: 0 12px 28px rgba(255, 94, 156, 0.55);
    }

    #noBtn {
      background: #f0f0f3;
      color: #888;
      position: relative;
      transition: left 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  top 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.3s ease,
                  box-shadow 0.3s ease;
    }

    /* Écran de confirmation */
    .celebration {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .celebration h1 {
      font-size: 32px;
    }

    .big-heart {
      font-size: 90px;
      animation: beat 0.8s ease-in-out infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.2); }
    }

    /* Adaptation aux petits écrans (téléphones) */
    @media (max-width: 480px) {
      .card {
        padding: 32px 22px 40px;
        border-radius: 22px;
      }
      h1 { font-size: 24px; }
      .celebration h1 { font-size: 27px; }
      p.subtitle { font-size: 15px; }
      .kitten { width: 150px; height: 150px; }
      button { font-size: 17px; padding: 13px 26px; }
      .big-heart { font-size: 76px; }
    }

    /* Chaton interactif : patte qui griffe */
    .kitten {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .kitten.wiggle {
      animation: wiggle 0.45s ease;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      20%      { transform: rotate(-9deg) scale(1.04); }
      45%      { transform: rotate(7deg); }
      70%      { transform: rotate(-4deg); }
    }

    .paw {
      position: fixed;
      width: 64px;
      height: 64px;
      pointer-events: none;
      z-index: 60;
      animation: paw-swipe 0.55s ease forwards;
    }
    .paw svg { width: 100%; height: 100%; display: block; }
    @keyframes paw-swipe {
      0%   { transform: translate(-50%, -50%) scale(0.2) rotate(-40deg); opacity: 0; }
      35%  { transform: translate(-50%, -50%) scale(1.15) rotate(-8deg); opacity: 1; }
      62%  { transform: translate(-50%, -50%) scale(1) rotate(18deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.4) rotate(-30deg); opacity: 0; }
    }

    .scratch {
      position: fixed;
      pointer-events: none;
      z-index: 59;
      animation: scratch-flash 0.5s ease forwards;
    }
    @keyframes scratch-flash {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5) rotate(18deg); }
      30%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(18deg); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.25) rotate(18deg); }
    }

    /* Humeur du chaton : transitions douces */
    #mouth { transition: d 0.4s ease; }
    #browL, #browR, #blushL, #blushR, #eyeL, #eyeR {
      transition: opacity 0.4s ease, ry 0.4s ease;
    }
    /* Larmes qui coulent quand le chaton est triste */
    .kitten.crying .tear {
      animation: tear-fall 1.1s ease-in infinite;
    }
    @keyframes tear-fall {
      0%   { opacity: 0.9; transform: translateY(0); }
      80%  { opacity: 0.7; }
      100% { opacity: 0; transform: translateY(18px); }
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <!-- Chaton gris mignon en SVG -->
    <svg class="kitten" id="kitten" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- oreilles -->
      <path d="M55 70 L40 28 L85 55 Z" fill="#9aa0a6"/>
      <path d="M145 70 L160 28 L115 55 Z" fill="#9aa0a6"/>
      <path d="M58 64 L50 40 L78 56 Z" fill="#f7c8d8"/>
      <path d="M142 64 L150 40 L122 56 Z" fill="#f7c8d8"/>
      <!-- tête -->
      <ellipse cx="100" cy="110" rx="62" ry="56" fill="#b0b6bc"/>
      <!-- joues plus claires -->
      <ellipse cx="100" cy="120" rx="50" ry="44" fill="#c3c8cd"/>
      <!-- joues roses (bonheur, cachées par défaut) -->
      <ellipse id="blushL" cx="64" cy="122" rx="12" ry="7" fill="#ff9ec4" opacity="0"/>
      <ellipse id="blushR" cx="136" cy="122" rx="12" ry="7" fill="#ff9ec4" opacity="0"/>
      <!-- sourcils tristes (cachés par défaut) -->
      <line id="browL" x1="68" y1="84" x2="90" y2="92" stroke="#5a5f64" stroke-width="3.5" stroke-linecap="round" opacity="0"/>
      <line id="browR" x1="132" y1="84" x2="110" y2="92" stroke="#5a5f64" stroke-width="3.5" stroke-linecap="round" opacity="0"/>
      <!-- yeux -->
      <ellipse id="eyeL" cx="78" cy="104" rx="11" ry="13" fill="#3a3f44"/>
      <ellipse id="eyeR" cx="122" cy="104" rx="11" ry="13" fill="#3a3f44"/>
      <circle cx="81" cy="100" r="3.5" fill="#fff"/>
      <circle cx="125" cy="100" r="3.5" fill="#fff"/>
      <!-- larmes (cachées par défaut) -->
      <ellipse id="tearL" class="tear" cx="74" cy="118" rx="4" ry="6" fill="#7ec8ff" opacity="0"/>
      <ellipse id="tearR" class="tear" cx="126" cy="118" rx="4" ry="6" fill="#7ec8ff" opacity="0"/>
      <!-- museau -->
      <path d="M93 122 L107 122 L100 130 Z" fill="#f7849f"/>
      <!-- bouche (modifiée par JS : sourire <-> triste) -->
      <path id="mouth" d="M86 130 Q100 140 114 130" stroke="#5a5f64" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- moustaches -->
      <line x1="70" y1="124" x2="38" y2="118" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/>
      <line x1="70" y1="130" x2="40" y2="132" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/>
      <line x1="130" y1="124" x2="162" y2="118" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/>
      <line x1="130" y1="130" x2="160" y2="132" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/>
      <!-- emoji sur la tête (change selon l'humeur) -->
      <text id="headEmoji" x="100" y="58" font-size="20" text-anchor="middle">💕</text>
    </svg>

    <div id="question">
      <h1>Une invitation pour toi 🥰</h1>
      <p class="subtitle">M'accompagnerais-tu au restaurant le <strong>15 juin</strong> pour fêter ton anniversaire ? 🍽️💕</p>

      <div class="buttons" id="btnArea">
        <button id="yesBtn">J'accepte 💖</button>
        <button id="noBtn">Non</button>
      </div>
    </div>

    <div class="celebration" id="celebration">
      <div class="big-heart">💖</div>
      <h1>Youpiii ! 🎉</h1>
      <p class="subtitle">Rendez-vous le <strong>15 juin</strong> ! J'ai hâte de fêter ça avec toi... 😻🥂</p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const btnArea = document.getElementById('btnArea');
    const question = document.getElementById('question');
    const celebration = document.getElementById('celebration');

    let yesScale = 1;

    function viewportSize() {
      const vv = window.visualViewport;
      return {
        w: vv ? vv.width : window.innerWidth,
        h: vv ? vv.height : window.innerHeight
      };
    }

    // Déplacement fluide du bouton "Non"
    function dodge() {
      const btnRect = noBtn.getBoundingClientRect();
      const vp = viewportSize();

      if (noBtn.style.position !== 'fixed') {
        noBtn.style.position = 'fixed';
        noBtn.style.margin = '0';
        noBtn.style.left = btnRect.left + 'px';
        noBtn.style.top = btnRect.top + 'px';
        noBtn.style.zIndex = 1;
        // Force un reflow pour que la 1ère transition parte de la position actuelle
        void noBtn.offsetWidth;
      }

      const margin = 14;
      const maxX = Math.max(margin, vp.w - btnRect.width - margin);
      const maxY = Math.max(margin, vp.h - btnRect.height - margin);
      const newX = margin + Math.random() * (maxX - margin);
      const newY = margin + Math.random() * (maxY - margin);

      noBtn.style.left = newX + 'px';
      noBtn.style.top = newY + 'px';

      // Le bouton "J'accepte" grossit sans jamais s'arrêter
      yesScale += 0.22;
      yesBtn.style.transform = 'scale(' + yesScale + ')';

      // Le chaton devient de plus en plus triste
      makeSadder();
    }

    // Se déplace uniquement au clic
    noBtn.addEventListener('click', function (e) {
      e.preventDefault();
      dodge();
    });
    // Pour mobile / tactile
    noBtn.addEventListener('touchstart', function (e) {
      e.preventDefault();
      dodge();
    }, { passive: false });

    // Clic sur "J'accepte" -> célébration
    yesBtn.addEventListener('click', function () {
      makeHappy();
      question.style.display = 'none';
      celebration.style.display = 'flex';
      noBtn.style.display = 'none';
      launchHearts(40);
    });

    // Coeurs flottants
    function spawnHeart() {
      const h = document.createElement('div');
      h.className = 'heart-bg';
      const hearts = ['💕', '💖', '💗', '🩷', '❤️'];
      h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (16 + Math.random() * 24) + 'px';
      const dur = 6 + Math.random() * 6;
      h.style.animationDuration = dur + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), dur * 1000);
    }
    setInterval(spawnHeart, 600);

    function launchHearts(n) {
      for (let i = 0; i < n; i++) {
        setTimeout(spawnHeart, i * 80);
      }
    }

    // ===== Chaton interactif : la patte qui griffe =====
    const kitten = document.querySelector('.kitten');

    // Éléments d'expression
    const mouth = document.getElementById('mouth');
    const browL = document.getElementById('browL');
    const browR = document.getElementById('browR');
    const tearL = document.getElementById('tearL');
    const tearR = document.getElementById('tearR');
    const blushL = document.getElementById('blushL');
    const blushR = document.getElementById('blushR');
    const eyeL = document.getElementById('eyeL');
    const eyeR = document.getElementById('eyeR');
    const headEmoji = document.getElementById('headEmoji');

    let sadCount = 0;

    // Rend le chaton de plus en plus triste à chaque "Non"
    function makeSadder() {
      sadCount++;
      const s = Math.min(sadCount * 0.16, 1); // 0 = neutre, 1 = très triste

      // bouche : sourire -> moue triste
      const ctrlY = 140 - s * 26;   // 140 (sourire) -> 114 (triste)
      const endY = 130 + s * 4;
      mouth.setAttribute('d', 'M86 ' + endY + ' Q100 ' + ctrlY + ' 114 ' + endY);

      // sourcils tristes qui apparaissent
      browL.setAttribute('opacity', s);
      browR.setAttribute('opacity', s);

      // joues roses disparaissent, plus de bonheur
      blushL.setAttribute('opacity', 0);
      blushR.setAttribute('opacity', 0);

      // larmes à partir d'un certain niveau de tristesse
      if (s >= 0.32) {
        tearL.setAttribute('opacity', 0.9);
        tearR.setAttribute('opacity', 0.9);
        kitten.classList.add('crying');
      }
      headEmoji.textContent = s >= 0.5 ? '💧' : '💕';
    }

    // Chaton tout content quand elle accepte
    function makeHappy() {
      sadCount = 0;
      kitten.classList.remove('crying');
      mouth.setAttribute('d', 'M80 124 Q100 152 120 124'); // grand sourire
      browL.setAttribute('opacity', 0);
      browR.setAttribute('opacity', 0);
      tearL.setAttribute('opacity', 0);
      tearR.setAttribute('opacity', 0);
      blushL.setAttribute('opacity', 0.85);
      blushR.setAttribute('opacity', 0.85);
      eyeL.setAttribute('ry', 8);  // yeux plissés de joie
      eyeR.setAttribute('ry', 8);
      headEmoji.textContent = '💖';
    }

    // ===== Miaou synthétisé par formants (hors-ligne, sans fichier) =====
    let audioCtx = null;
    function playMeow() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = audioCtx || new AC();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const t = audioCtx.currentTime;
        const dur = 0.52;

        // Source glottique (cordes vocales du chaton) : aiguë
        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(780, t);
        osc.frequency.linearRampToValueAtTime(1180, t + 0.12); // montée "mi" (aiguë)
        osc.frequency.linearRampToValueAtTime(980, t + 0.30);
        osc.frequency.linearRampToValueAtTime(720, t + dur);    // descente "ow"

        // Vibrato (donne le côté vivant/plaintif)
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.frequency.value = 22;
        lfoGain.gain.value = 30;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        // Deux formants qui balaient la voyelle "iii -> aaa -> ooow"
        const f1 = audioCtx.createBiquadFilter();
        f1.type = 'bandpass';
        f1.Q.value = 8;
        f1.frequency.setValueAtTime(450, t);          // i
        f1.frequency.linearRampToValueAtTime(1050, t + 0.28); // a
        f1.frequency.linearRampToValueAtTime(650, t + dur);  // o

        const f2 = audioCtx.createBiquadFilter();
        f2.type = 'bandpass';
        f2.Q.value = 10;
        f2.frequency.setValueAtTime(3000, t);          // i
        f2.frequency.linearRampToValueAtTime(1900, t + 0.28); // a
        f2.frequency.linearRampToValueAtTime(1250, t + dur);   // o

        const f1g = audioCtx.createGain(); f1g.gain.value = 1.0;
        const f2g = audioCtx.createGain(); f2g.gain.value = 0.7;

        // Enveloppe de volume
        const out = audioCtx.createGain();
        out.gain.setValueAtTime(0.0001, t);
        out.gain.exponentialRampToValueAtTime(0.32, t + 0.06);
        out.gain.setValueAtTime(0.32, t + 0.30);
        out.gain.exponentialRampToValueAtTime(0.0001, t + dur);

        osc.connect(f1); f1.connect(f1g); f1g.connect(out);
        osc.connect(f2); f2.connect(f2g); f2g.connect(out);
        out.connect(audioCtx.destination);

        osc.start(t);  lfo.start(t);
        osc.stop(t + dur + 0.05);
        lfo.stop(t + dur + 0.05);
      } catch (e) { /* audio non dispo : on ignore */ }
    }

    const PAW_SVG =
      '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
      '<ellipse cx="50" cy="63" rx="27" ry="23" fill="#aab0b6"/>' +
      '<ellipse cx="50" cy="67" rx="17" ry="13" fill="#f7c8d8"/>' +
      '<ellipse cx="27" cy="40" rx="9" ry="12" fill="#aab0b6"/>' +
      '<ellipse cx="43" cy="29" rx="9" ry="12" fill="#aab0b6"/>' +
      '<ellipse cx="59" cy="29" rx="9" ry="12" fill="#aab0b6"/>' +
      '<ellipse cx="75" cy="40" rx="9" ry="12" fill="#aab0b6"/>' +
      '</svg>';

    const SCRATCH_SVG =
      '<svg viewBox="0 0 80 80" width="78" height="78" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M12 14 L40 62" stroke="#ff5e9c" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      '<path d="M30 8 L58 56" stroke="#ff9ec4" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      '<path d="M48 12 L72 54" stroke="#ff5e9c" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      '</svg>';

    function clawAt(x, y) {
      const paw = document.createElement('div');
      paw.className = 'paw';
      paw.style.left = x + 'px';
      paw.style.top = y + 'px';
      paw.innerHTML = PAW_SVG;
      document.body.appendChild(paw);
      setTimeout(function () { paw.remove(); }, 600);

      const scr = document.createElement('div');
      scr.className = 'scratch';
      scr.style.left = x + 'px';
      scr.style.top = y + 'px';
      scr.innerHTML = SCRATCH_SVG;
      document.body.appendChild(scr);
      setTimeout(function () { scr.remove(); }, 520);

      // petit sursaut rigolo du chaton
      kitten.classList.remove('wiggle');
      void kitten.offsetWidth;
      kitten.classList.add('wiggle');
    }

    function pokeKitten(e) {
      e.preventDefault();
      let x, y;
      if (e.touches && e.touches[0]) {
        x = e.touches[0].clientX;
        y = e.touches[0].clientY;
      } else {
        x = e.clientX;
        y = e.clientY;
      }
      playMeow();
      clawAt(x, y);
    }

    kitten.addEventListener('click', pokeKitten);
    kitten.addEventListener('touchstart', pokeKitten, { passive: false });
    kitten.addEventListener('animationend', function () {
      kitten.classList.remove('wiggle');
    });
  </script>
</body>
</html>
